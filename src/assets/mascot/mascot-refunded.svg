<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="ref-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ref-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba7d56"/>
      <stop offset="100%" stop-color="#935733"/>
    </linearGradient>
    <linearGradient id="ref-skin-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#935733"/>
      <stop offset="100%" stop-color="#733d1f"/>
    </linearGradient>
    <linearGradient id="ref-hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5b8"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="ref-hoodie-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="ref-pants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ref-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="60%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="ref-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0d1b2a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="296" rx="65" ry="10" fill="#0d1b2a" opacity="0.15"/>
  <circle cx="160" cy="150" r="130" fill="url(#ref-glow)"/>

  <!-- Golden shimmer coins & return arrow particles -->
  <circle cx="85" cy="115" r="3.5" fill="#ffd166"/>
  <circle cx="240" cy="110" r="3" fill="#10b981"/>

  <g filter="url(#ref-shadow)">
    <!-- Legs -->
    <path d="M140 245 L138 285 L128 288 C123 290 123 295 131 296 L151 296 C156 296 158 292 156 288 L151 245 Z" fill="url(#ref-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M170 245 L172 285 L182 288 C187 290 187 295 179 296 L159 296 C154 296 152 292 154 288 L159 245 Z" fill="url(#ref-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M128 291 C128 291 136 287 151 291 L151 295 L129 295 Z" fill="#00e5b8"/>
    <path d="M182 291 C182 291 174 287 159 291 L159 295 L181 295 Z" fill="#00e5b8"/>

    <!-- Left Arm: Holding Leather Money Pouch with Gold Coins -->
    <path d="M120 170 L95 185 L108 215" stroke="url(#ref-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 170 L95 185 L108 215" stroke="#0077b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Money Pouch -->
    <g transform="translate(80, 190)">
      <path d="M10 18 C5 22 2 35 12 45 C22 55 38 55 48 45 C58 35 55 22 50 18 C45 14 38 18 30 18 C22 18 15 14 10 18 Z" fill="#b45309" stroke="#78350f" stroke-width="2.2"/>
      <!-- Pouch tie string -->
      <path d="M18 19 C25 24 35 24 42 19" stroke="#ffd166" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Gold Coin emerging -->
      <circle cx="30" cy="14" r="8" fill="url(#ref-gold)" stroke="#b45309" stroke-width="1.8"/>
      <text x="30" y="18" font-size="10" font-family="sans-serif" font-weight="bold" fill="#78350f" text-anchor="middle">₵</text>
    </g>
    <circle cx="116" cy="215" r="8.5" fill="url(#ref-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Torso -->
    <path d="M120 165 C120 165 130 152 160 152 C190 152 200 165 200 165 L206 230 C206 242 196 248 185 248 L135 248 C124 248 114 242 114 230 Z" fill="url(#ref-hoodie)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M132 216 L188 216 L182 242 L138 242 Z" fill="url(#ref-hoodie-dark)" opacity="0.35"/>
    <path d="M154 175 L166 175 L166 185 C166 190 160 194 160 194 C160 194 154 190 154 185 Z" fill="#ffd166" stroke="#0d1b2a" stroke-width="1.5"/>
    <path d="M156 177 L164 177 L164 184 C164 187 160 190 160 190 C160 190 156 187 156 184 Z" fill="#00e5b8"/>

    <!-- Right Arm: Holding Green Refund Confirmation Receipt -->
    <path d="M198 170 L220 185 L212 215" stroke="url(#ref-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 170 L220 185 L212 215" stroke="#0077b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Refund Receipt with Green Arrow -->
    <g transform="translate(205, 180) rotate(8)">
      <rect x="0" y="0" width="38" height="52" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <circle cx="19" cy="18" r="9" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
      <!-- Circular Return Arrow -->
      <path d="M15 17 A4 4 0 1 1 23 19" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="14,14 14,18 18,18" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="8" y1="34" x2="30" y2="34" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="41" x2="24" y2="41" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <circle cx="206" cy="216" r="8.5" fill="url(#ref-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Neck & Collar -->
    <path d="M148 145 L172 145 L174 158 L146 158 Z" fill="url(#ref-skin-dark)"/>
    <path d="M140 155 C145 168 175 168 180 155 C172 165 148 165 140 155 Z" fill="#0077b6" stroke="#0f172a" stroke-width="2"/>

    <!-- Head -->
    <path d="M130 92 C130 65 190 65 190 92 C192 118 185 146 160 146 C135 146 128 118 130 92 Z" fill="url(#ref-skin)" stroke="#733d1f" stroke-width="2.5"/>

    <!-- Ears -->
    <circle cx="127" cy="105" r="9" fill="url(#ref-skin)" stroke="#733d1f" stroke-width="2"/>
    <circle cx="193" cy="105" r="9" fill="url(#ref-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Hair -->
    <path d="M126 88 C124 64 135 48 160 48 C185 48 196 64 194 88 C192 72 188 62 160 62 C132 62 128 72 126 88 Z" fill="#1b120c"/>
    <path d="M128 78 C126 50 140 40 160 40 C180 40 194 50 192 78 C185 54 175 48 160 48 C145 48 135 54 128 78 Z" fill="#1b120c"/>
    <circle cx="140" cy="50" r="10" fill="#241710"/>
    <circle cx="155" cy="45" r="11" fill="#2b1c14"/>
    <circle cx="170" cy="47" r="10.5" fill="#241710"/>
    <circle cx="182" cy="56" r="9" fill="#1b120c"/>
    <circle cx="132" cy="58" r="9" fill="#1b120c"/>

    <!-- Eyebrows (Relieved, friendly) -->
    <path d="M137 92 C142 88 149 89 153 93" stroke="#1b120c" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M167 93 C171 89 178 88 183 92" stroke="#1b120c" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Gentle, honest, relieved smile) -->
    <ellipse cx="144" cy="103" rx="7.5" ry="9" fill="#1b120c"/>
    <circle cx="142" cy="100" r="3" fill="#ffffff"/>
    <circle cx="146.5" cy="105" r="1.3" fill="#ffffff"/>
    <ellipse cx="176" cy="103" rx="7.5" ry="9" fill="#1b120c"/>
    <circle cx="174" cy="100" r="3" fill="#ffffff"/>
    <circle cx="178.5" cy="105" r="1.3" fill="#ffffff"/>

    <ellipse cx="138" cy="116" rx="6" ry="3.5" fill="#d97757" opacity="0.35"/>
    <ellipse cx="182" cy="116" rx="6" ry="3.5" fill="#d97757" opacity="0.35"/>

    <!-- Nose -->
    <path d="M157 110 C158 114 162 114 163 110" stroke="#733d1f" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Reassuring warm smile -->
    <path d="M144 123 C149 133 171 133 176 123" stroke="#733d1f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M147 124 C152 129 168 129 173 124" fill="#ffffff"/>
  </g>
</svg>

