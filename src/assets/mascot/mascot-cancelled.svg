<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="cnc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cnc-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba7d56"/>
      <stop offset="100%" stop-color="#935733"/>
    </linearGradient>
    <linearGradient id="cnc-skin-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#935733"/>
      <stop offset="100%" stop-color="#733d1f"/>
    </linearGradient>
    <linearGradient id="cnc-hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5b8"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="cnc-hoodie-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="cnc-pants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cnc-folder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cnc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0d1b2a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="296" rx="65" ry="10" fill="#0d1b2a" opacity="0.15"/>
  <circle cx="160" cy="150" r="130" fill="url(#cnc-glow)"/>

  <g filter="url(#cnc-shadow)">
    <!-- Legs -->
    <path d="M140 245 L138 285 L128 288 C123 290 123 295 131 296 L151 296 C156 296 158 292 156 288 L151 245 Z" fill="url(#cnc-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M170 245 L172 285 L182 288 C187 290 187 295 179 296 L159 296 C154 296 152 292 154 288 L159 245 Z" fill="url(#cnc-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M128 291 C128 291 136 287 151 291 L151 295 L129 295 Z" fill="#00e5b8"/>
    <path d="M182 291 C182 291 174 287 159 291 L159 295 L181 295 Z" fill="#00e5b8"/>

    <!-- Torso -->
    <path d="M120 165 C120 165 130 152 160 152 C190 152 200 165 200 165 L206 230 C206 242 196 248 185 248 L135 248 C124 248 114 242 114 230 Z" fill="url(#cnc-hoodie)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Left & Right Arms Holding Closed Document Folder -->
    <path d="M122 170 L135 205 L150 205" stroke="url(#cnc-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 170 L185 205 L170 205" stroke="url(#cnc-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Closed Contract Folder in Hands -->
    <g transform="translate(125, 175)">
      <rect x="0" y="0" width="70" height="52" rx="4" fill="url(#cnc-folder)" stroke="#64748b" stroke-width="2.2"/>
      <path d="M0 0 L25 0 L32 10 L70 10 L70 52 L0 52 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
      <!-- Lines -->
      <line x1="12" y1="20" x2="40" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="27" x2="35" y2="27" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Soft red cancelled seal -->
      <circle cx="50" cy="32" r="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
      <path d="M44 26 L56 38" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M56 26 L44 38" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Hands resting on folder -->
    <circle cx="128" cy="202" r="8.5" fill="url(#cnc-skin)" stroke="#733d1f" stroke-width="2"/>
    <circle cx="192" cy="202" r="8.5" fill="url(#cnc-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Neck & Collar -->
    <path d="M148 145 L172 145 L174 158 L146 158 Z" fill="url(#cnc-skin-dark)"/>
    <path d="M140 155 C145 168 175 168 180 155 C172 165 148 165 140 155 Z" fill="#0077b6" stroke="#0f172a" stroke-width="2"/>

    <!-- Head -->
    <path d="M130 92 C130 65 190 65 190 92 C192 118 185 146 160 146 C135 146 128 118 130 92 Z" fill="url(#cnc-skin)" stroke="#733d1f" stroke-width="2.5"/>

    <!-- Ears -->
    <circle cx="127" cy="105" r="9" fill="url(#cnc-skin)" stroke="#733d1f" stroke-width="2"/>
    <circle cx="193" cy="105" r="9" fill="url(#cnc-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Hair: Afro Fade -->
    <path d="M126 88 C124 64 135 48 160 48 C185 48 196 64 194 88 C192 72 188 62 160 62 C132 62 128 72 126 88 Z" fill="#1b120c"/>
    <path d="M128 78 C126 50 140 40 160 40 C180 40 194 50 192 78 C185 54 175 48 160 48 C145 48 135 54 128 78 Z" fill="#1b120c"/>
    <circle cx="140" cy="50" r="10" fill="#241710"/>
    <circle cx="155" cy="45" r="11" fill="#2b1c14"/>
    <circle cx="170" cy="47" r="10.5" fill="#241710"/>
    <circle cx="182" cy="56" r="9" fill="#1b120c"/>
    <circle cx="132" cy="58" r="9" fill="#1b120c"/>

    <!-- Eyebrows (Gentle, sympathetic arches) -->
    <path d="M138 93 C143 91 149 92 152 94" stroke="#1b120c" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M168 94 C171 92 177 91 182 93" stroke="#1b120c" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Soft, calming eyes -->
    <ellipse cx="144" cy="104" rx="7.5" ry="9" fill="#1b120c"/>
    <circle cx="143" cy="101" r="3" fill="#ffffff"/>
    <circle cx="147" cy="106" r="1.2" fill="#ffffff"/>
    <ellipse cx="176" cy="104" rx="7.5" ry="9" fill="#1b120c"/>
    <circle cx="175" cy="101" r="3" fill="#ffffff"/>
    <circle cx="179" cy="106" r="1.2" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M157 111 C158 115 162 115 163 111" stroke="#733d1f" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Reassuring, calm closed smile -->
    <path d="M148 126 C154 132 166 132 172 126" stroke="#733d1f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>

