<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="dsp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dsp-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba7d56"/>
      <stop offset="100%" stop-color="#935733"/>
    </linearGradient>
    <linearGradient id="dsp-skin-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#935733"/>
      <stop offset="100%" stop-color="#733d1f"/>
    </linearGradient>
    <linearGradient id="dsp-hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5b8"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="dsp-hoodie-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="dsp-pants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dsp-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="dsp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0d1b2a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="296" rx="65" ry="10" fill="#0d1b2a" opacity="0.15"/>
  <circle cx="160" cy="150" r="130" fill="url(#dsp-glow)"/>

  <g filter="url(#dsp-shadow)">
    <!-- Legs -->
    <path d="M140 245 L138 285 L128 288 C123 290 123 295 131 296 L151 296 C156 296 158 292 156 288 L151 245 Z" fill="url(#dsp-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M170 245 L172 285 L182 288 C187 290 187 295 179 296 L159 296 C154 296 152 292 154 288 L159 245 Z" fill="url(#dsp-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M128 291 C128 291 136 287 151 291 L151 295 L129 295 Z" fill="#00e5b8"/>
    <path d="M182 291 C182 291 174 287 159 291 L159 295 L181 295 Z" fill="#00e5b8"/>

    <!-- Left Arm: Holding document being examined -->
    <path d="M120 170 L98 185 L110 215" stroke="url(#dsp-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120 170 L98 185 L110 215" stroke="#0077b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Document in left hand -->
    <g transform="translate(85, 175) rotate(-10)">
      <rect x="0" y="0" width="45" height="58" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="8" y="10" width="20" height="4" rx="1.5" fill="#f59e0b"/>
      <line x1="8" y1="20" x2="36" y2="20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="27" x2="30" y2="27" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="34" x2="34" y2="34" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <!-- Small amber dispute tag -->
      <circle cx="28" cy="45" r="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M28 41 L28 46" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="28" cy="48.5" r="0.8" fill="#d97706"/>
    </g>
    <!-- Left Hand holding document -->
    <circle cx="118" cy="208" r="8.5" fill="url(#dsp-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Torso -->
    <path d="M120 165 C120 165 130 152 160 152 C190 152 200 165 200 165 L206 230 C206 242 196 248 185 248 L135 248 C124 248 114 242 114 230 Z" fill="url(#dsp-hoodie)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M132 216 L188 216 L182 242 L138 242 Z" fill="url(#dsp-hoodie-dark)" opacity="0.35"/>
    <path d="M154 175 L166 175 L166 185 C166 190 160 194 160 194 C160 194 154 190 154 185 Z" fill="#ffd166" stroke="#0d1b2a" stroke-width="1.5"/>
    <path d="M156 177 L164 177 L164 184 C164 187 160 190 160 190 C160 190 156 187 156 184 Z" fill="#00e5b8"/>

    <!-- Right Arm: Holding Large Magnifying Glass Looking Through -->
    <path d="M198 170 L220 185 L200 160" stroke="url(#dsp-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 170 L220 185 L200 160" stroke="#0077b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Magnifying Glass -->
    <g transform="translate(180, 110)">
      <!-- Handle -->
      <path d="M35 55 L58 78" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
      <path d="M35 55 L58 78" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
      <!-- Brass Rim -->
      <circle cx="20" cy="40" r="28" fill="none" stroke="#ffd166" stroke-width="5"/>
      <circle cx="20" cy="40" r="28" fill="none" stroke="#b45309" stroke-width="1.5"/>
      <!-- Glass Lens with Reflection -->
      <circle cx="20" cy="40" r="25.5" fill="url(#dsp-lens)"/>
      <path d="M8 28 C14 20 28 20 34 26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
      <circle cx="30" cy="48" r="3" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Right hand holding handle -->
    <circle cx="218" cy="168" r="9" fill="url(#dsp-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Neck & Collar -->
    <path d="M148 145 L172 145 L174 158 L146 158 Z" fill="url(#dsp-skin-dark)"/>
    <path d="M140 155 C145 168 175 168 180 155 C172 165 148 165 140 155 Z" fill="#0077b6" stroke="#0f172a" stroke-width="2"/>

    <!-- Head -->
    <path d="M130 92 C130 65 190 65 190 92 C192 118 185 146 160 146 C135 146 128 118 130 92 Z" fill="url(#dsp-skin)" stroke="#733d1f" stroke-width="2.5"/>

    <!-- Ears -->
    <circle cx="127" cy="105" r="9" fill="url(#dsp-skin)" stroke="#733d1f" stroke-width="2"/>
    <circle cx="193" cy="105" r="9" fill="url(#dsp-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- Hair: Afro Fade -->
    <path d="M126 88 C124 64 135 48 160 48 C185 48 196 64 194 88 C192 72 188 62 160 62 C132 62 128 72 126 88 Z" fill="#1b120c"/>
    <path d="M128 78 C126 50 140 40 160 40 C180 40 194 50 192 78 C185 54 175 48 160 48 C145 48 135 54 128 78 Z" fill="#1b120c"/>
    <circle cx="140" cy="50" r="10" fill="#241710"/>
    <circle cx="155" cy="45" r="11" fill="#2b1c14"/>
    <circle cx="170" cy="47" r="10.5" fill="#241710"/>
    <circle cx="182" cy="56" r="9" fill="#1b120c"/>
    <circle cx="132" cy="58" r="9" fill="#1b120c"/>

    <!-- Eyebrows: One raised quizzically / analytically, one focused -->
    <path d="M136 94 C140 91 148 91 152 94" stroke="#1b120c" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M166 88 C172 84 180 85 185 90" stroke="#1b120c" stroke-width="3.2" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Focused, examining carefully) -->
    <ellipse cx="144" cy="104" rx="7.5" ry="9" fill="#1b120c"/>
    <circle cx="142.5" cy="101" r="3" fill="#ffffff"/>
    <ellipse cx="176" cy="102" rx="8.5" ry="10" fill="#1b120c"/>
    <circle cx="174" cy="99" r="3.5" fill="#ffffff"/>
    <circle cx="179" cy="105" r="1.3" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M157 111 C158 115 162 115 163 111" stroke="#733d1f" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Thoughtful pursed mouth (hmmm, let me inspect this) -->
    <ellipse cx="158" cy="127" rx="4.5" ry="3.5" fill="#991b1b" stroke="#733d1f" stroke-width="1.8"/>
  </g>
</svg>

