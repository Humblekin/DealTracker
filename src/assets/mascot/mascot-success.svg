<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="suc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suc-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba7d56"/>
      <stop offset="100%" stop-color="#935733"/>
    </linearGradient>
    <linearGradient id="suc-skin-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#935733"/>
      <stop offset="100%" stop-color="#733d1f"/>
    </linearGradient>
    <linearGradient id="suc-hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5b8"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="suc-hoodie-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="suc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="40%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>
    <linearGradient id="suc-gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e09f3e"/>
      <stop offset="100%" stop-color="#bc6c25"/>
    </linearGradient>
    <linearGradient id="suc-pants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="suc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0d1b2a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ground Soft Shadow -->
  <ellipse cx="160" cy="296" rx="65" ry="10" fill="#0d1b2a" opacity="0.15"/>
  <!-- Ambient celebration glow -->
  <circle cx="160" cy="150" r="130" fill="url(#suc-glow)"/>

  <!-- Confetti / Sparkles -->
  <path d="M75 90 L80 75 L85 90 L100 95 L85 100 L80 115 L75 100 L60 95 Z" fill="#ffd166" opacity="0.9"/>
  <path d="M250 80 L253 70 L256 80 L266 83 L256 86 L253 96 L250 86 L240 83 Z" fill="#00e5b8" opacity="0.85"/>
  <path d="M60 170 L62 163 L64 170 L71 172 L64 174 L62 181 L60 174 L53 172 Z" fill="#ff70a6" opacity="0.8"/>
  <path d="M265 160 L268 152 L271 160 L279 163 L271 166 L268 174 L265 166 L257 163 Z" fill="#ffd166" opacity="0.85"/>
  <circle cx="95" cy="55" r="4" fill="#ff70a6"/>
  <circle cx="230" cy="50" r="3.5" fill="#00e5b8"/>
  <circle cx="280" cy="115" r="3" fill="#ff9f1c"/>
  <circle cx="50" cy="130" r="3.5" fill="#ffd166"/>

  <g filter="url(#suc-shadow)">
    <!-- Legs / Feet -->
    <path d="M138 245 L135 285 L125 288 C120 290 120 295 128 296 L148 296 C153 296 155 292 153 288 L149 245 Z" fill="url(#suc-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M172 245 L175 285 L185 288 C190 290 190 295 182 296 L162 296 C157 296 155 292 157 288 L161 245 Z" fill="url(#suc-pants)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Shoes Teal Accents -->
    <path d="M125 291 C125 291 133 287 148 291 L148 295 L126 295 Z" fill="#00e5b8"/>
    <path d="M185 291 C185 291 177 287 162 291 L162 295 L184 295 Z" fill="#00e5b8"/>

    <!-- Left Arm (Holding Golden Trophy High) -->
    <path d="M122 170 L95 150 L85 110" stroke="url(#suc-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M122 170 L95 150 L85 110" stroke="#0077b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Hand on trophy -->
    <circle cx="84" cy="104" r="9" fill="url(#suc-skin)" stroke="#733d1f" stroke-width="2"/>

    <!-- GOLDEN TROPHY CUP -->
    <!-- Handles -->
    <path d="M52 68 C40 68 40 92 56 94" fill="none" stroke="url(#suc-gold-dark)" stroke-width="5" stroke-linecap="round"/>
    <path d="M102 68 C114 68 114 92 98 94" fill="none" stroke="url(#suc-gold-dark)" stroke-width="5" stroke-linecap="round"/>
    <!-- Cup Body -->
    <path d="M54 58 L100 58 L94 92 C92 102 82 108 77 108 C72 108 62 102 60 92 Z" fill="url(#suc-gold)" stroke="#bc6c25" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Cup Highlights -->
    <path d="M58 63 L65 63 L68 90 C67 94 65 96 63 94 Z" fill="#fff" opacity="0.45"/>
    <path d="M77 70 L80 77 L87 77 L82 82 L84 89 L77 84 L70 89 L72 82 L67 77 L74 77 Z" fill="#bc6c25" opacity="0.35"/>
    <!-- Trophy Stem & Base -->
    <path d="M74 108 L80 108 L80 118 L74 118 Z" fill="url(#suc-gold-dark)"/>
    <path d="M64 118 L90 118 L93 126 L61 126 Z" fill="url(#suc-gold)" stroke="#bc6c25" stroke-width="2"/>
    <rect x="63" y="126" width="28" height="12" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <!-- Plaque on trophy -->
    <rect x="68" y="129" width="18" height="6" rx="1" fill="url(#suc-gold)"/>

    <!-- Torso / Hoodie -->
    <path d="M120 165 C120 165 130 152 160 152 C190 152 200 165 200 165 L206 230 C206 242 196 248 185 248 L135 248 C124 248 114 242 114 230 Z" fill="url(#suc-hoodie)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Hoodie Pocket -->
    <path d="M132 216 L188 216 L182 242 L138 242 Z" fill="url(#suc-hoodie-dark)" opacity="0.35"/>
    <path d="M132 216 L188 216 L182 242 L138 242 Z" stroke="#0077b6" stroke-width="2" fill="none"/>
    <!-- DealGuider Shield Emblem on Chest -->
    <path d="M154 175 L166 175 L166 185 C166 190 160 194 160 194 C160 194 154 190 154 185 Z" fill="#ffd166" stroke="#0d1b2a" stroke-width="1.5"/>
    <path d="M156 177 L164 177 L164 184 C164 187 160 190 160 190 C160 190 156 187 156 184 Z" fill="#00e5b8"/>

    <!-- Right Arm (Joyful Thumbs Up) -->
    <path d="M198 170 L225 185 L236 170" stroke="url(#suc-hoodie)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 170 L225 185 L236 170" stroke="#0077b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Thumbs up hand -->
    <g transform="translate(236, 150)">
      <circle cx="8" cy="14" r="9" fill="url(#suc-skin)" stroke="#733d1f" stroke-width="2"/>
      <!-- Thumb pointing up -->
      <path d="M8 12 L8 2 C8 -1 13 -1 13 2 L13 12 Z" fill="url(#suc-skin)" stroke="#733d1f" stroke-width="2" stroke-linejoin="round"/>
      <path d="M3 13 C3 10 13 10 14 13" stroke="#733d1f" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Neck & Hoodie Collar -->
    <path d="M148 145 L172 145 L174 158 L146 158 Z" fill="url(#suc-skin-dark)"/>
    <path d="M140 155 C145 168 175 168 180 155 C172 165 148 165 140 155 Z" fill="#0077b6" stroke="#0f172a" stroke-width="2"/>

    <!-- Head / Face -->
    <path d="M130 92 C130 65 190 65 190 92 C192 118 185 146 160 146 C135 146 128 118 130 92 Z" fill="url(#suc-skin)" stroke="#733d1f" stroke-width="2.5"/>

    <!-- Ears -->
    <circle cx="127" cy="105" r="9" fill="url(#suc-skin)" stroke="#733d1f" stroke-width="2"/>
    <path d="M126 102 C128 104 128 107 125 108" stroke="#733d1f" stroke-width="1.8" fill="none"/>
    <circle cx="193" cy="105" r="9" fill="url(#suc-skin)" stroke="#733d1f" stroke-width="2"/>
    <path d="M194 102 C192 104 192 107 195 108" stroke="#733d1f" stroke-width="1.8" fill="none"/>

    <!-- Hair: Modern Textured Afro Fade -->
    <path d="M126 88 C124 64 135 48 160 48 C185 48 196 64 194 88 C192 72 188 62 160 62 C132 62 128 72 126 88 Z" fill="#1b120c"/>
    <path d="M128 78 C126 50 140 40 160 40 C180 40 194 50 192 78 C185 54 175 48 160 48 C145 48 135 54 128 78 Z" fill="#1b120c"/>
    <!-- Hair Texture Curls / Volume -->
    <circle cx="140" cy="50" r="10" fill="#241710"/>
    <circle cx="155" cy="45" r="11" fill="#2b1c14"/>
    <circle cx="170" cy="47" r="10.5" fill="#241710"/>
    <circle cx="182" cy="56" r="9" fill="#1b120c"/>
    <circle cx="132" cy="58" r="9" fill="#1b120c"/>
    <path d="M130 84 C134 78 142 82 145 78 C148 82 156 78 160 80 C164 78 172 82 175 78 C178 82 186 78 190 84" stroke="#1b120c" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Cheeks (Blushing happiness) -->
    <ellipse cx="138" cy="116" rx="7" ry="4" fill="#d97757" opacity="0.45"/>
    <ellipse cx="182" cy="116" rx="7" ry="4" fill="#d97757" opacity="0.45"/>

    <!-- Eyebrows (High, Cheerful arches) -->
    <path d="M137 92 C142 87 149 88 152 92" stroke="#1b120c" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M168 92 C171 88 178 87 183 92" stroke="#1b120c" stroke-width="3.2" stroke-linecap="round" fill="none"/>

    <!-- Big Joyful Eyes -->
    <!-- Left Eye -->
    <ellipse cx="144" cy="103" rx="7.5" ry="9" fill="#1b120c"/>
    <circle cx="142" cy="100" r="3" fill="#ffffff"/>
    <circle cx="146.5" cy="105" r="1.3" fill="#ffffff"/>
    <!-- Right Eye -->
    <ellipse cx="176" cy="103" rx="7.5" ry="9" fill="#1b120c"/>
    <circle cx="174" cy="100" r="3" fill="#ffffff"/>
    <circle cx="178.5" cy="105" r="1.3" fill="#ffffff"/>

    <!-- Cute Nose -->
    <path d="M157 110 C158 114 162 114 163 110" stroke="#733d1f" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Big Happy Winning Smile with Teeth -->
    <path d="M142 122 C146 138 174 138 178 122 Z" fill="#991b1b" stroke="#733d1f" stroke-width="2"/>
    <!-- White Teeth -->
    <path d="M145 123 C150 128 170 128 175 123 C172 122 148 122 145 123 Z" fill="#ffffff"/>
    <!-- Tongue -->
    <path d="M152 133 C156 130 164 130 168 133 C166 136 154 136 152 133 Z" fill="#f472b6"/>
  </g>
</svg>

